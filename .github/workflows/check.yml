name: Test and build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:gallery
      - run: npm test
      - run: npm run build
      - name: Verify generated files are current
        run: git diff --exit-code -- data/cases.json agents/skills/gpt-image-2-style-library/references/style-library.md
